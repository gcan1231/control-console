<body class="pub-page"><a class="skip-link" href="#main-content">跳到交接内容</a><aside class="sidebar"><div class="brand"><span class="brand-mark" id="pub-brand" aria-hidden="true"></span><div>总控制台<small>运营工作台</small></div></div><div class="nav-caption">工作台</div><nav aria-label="主导航"><a href="/selection.html">每日选品</a><a href="/">任务总表</a><a href="/?page=sources">来源与账号资料</a><a href="/logs.html">日志中心</a><a href="/publish.html" class="active" aria-current="page">发文交接</a></nav><div class="sidebar-note"><span class="note-caption">当前计划</span><strong>007 · 五槽发文交接</strong><p>逐账号执行与结果追踪<br>每批核对后启动</p></div></aside>
<main id="main-content" tabindex="-1"><header class="topbar"><div class="breadcrumb">工作空间 / 发文交接</div><a href="/">返回任务工作台</a></header><section class="page-heading"><div><h1>发文工作台</h1><p>准备已复核成片，绑定账号浏览器，再按批次执行和核对结果。</p></div><button class="secondary" id="pub-refresh">刷新本地状态</button></section>
<p class="pub-notice">J列保留原端口记忆提示，实际端口单独填写。软件回执与人工核验分别记录；结果未知时不自动重发。</p><p id="pub-message" role="status" aria-live="polite" hidden></p>
<section class="panel"><div class="panel-heading"><h2>选择交接任务</h2><a href="/?page=editing">前往剪辑交接</a></div><div class="pub-filters"><label>发文目标<select id="pub-mode" name="mode"><option value="both">抖音和千川</option><option value="douyin">抖音（变速成片）</option><option value="qianchuan">千川（普通成片）</option></select></label><label>账号<select id="pub-account" name="account"><option value="">全部账号</option></select></label><label class="pub-search">搜索任务<input id="pub-search" type="search" name="search" autocomplete="off" placeholder="商品名称、账号或完整商品ID…"></label></div><div class="pub-selection"><label><input type="checkbox" id="pub-select-all">选择当前页可交接任务</label><span id="pub-selected" role="status">已选0个任务</span></div><div class="pub-table-scroll"><table class="pub-task-table"><thead><tr><th scope="col">选择</th><th scope="col">账号 / 商品任务</th><th scope="col">成片复核</th><th scope="col">交接条件</th></tr></thead><tbody id="pub-tasks"></tbody></table></div><div class="panel-footer"><button class="secondary" id="pub-prev">上一页</button><span id="pub-page-count"></span><button class="secondary" id="pub-next">下一页</button></div><div class="pub-prepare"><h3>已选账号的实际端口</h3><p class="pub-muted">端口按原软件环境填写，不从J列自动取值。不同账号使用不同端口。</p><div id="pub-ports" class="pub-port-grid"></div><button class="primary" id="pub-prepare">准备独立五槽交接包</button></div></section>
<section id="publisher-execution" aria-label="自动发文"></section><section class="pub-packages"><h2>交接包与回执</h2><div id="pub-packages"><p class="pub-empty">正在读取交接包…</p></div></section></main>
<dialog id="pub-dialog" aria-labelledby="pub-dialog-title"><form method="dialog"><div class="pub-dialog-top"><h2 id="pub-dialog-title"></h2><button type="submit" class="secondary" value="cancel" aria-label="关闭确认窗口">关闭</button></div><div id="pub-dialog-body"></div><p id="pub-dialog-error" role="alert" hidden></p><div class="pub-dialog-footer"><button type="button" class="primary" id="pub-confirm">确认记录</button></div></form></dialog><script type="module" src="/modules/publishing.js"></script><script type="module" src="/modules/publisher-execution.js"></script></body></html>
