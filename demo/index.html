<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#f8fafc"><title>总控制台 · 任务工作台</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/local.css"><link rel="stylesheet" href="/workbench.css"><link rel="stylesheet" href="/account-capture.css"><link rel="stylesheet" href="/graphite.css"></head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" data-icon="layers"></span><div>总控制台<small>运营工作台</small></div></div>
    <div class="nav-caption">工作台</div>
    <nav aria-label="主导航">
      <button data-page="tasks" class="active" aria-label="任务总表" title="任务总表"><span data-icon="table"></span><span class="nav-text">任务总表</span></button>
      <button data-page="sources" aria-label="数据快照" title="数据快照"><span data-icon="database"></span><span class="nav-text">数据快照</span></button>
      <button data-page="publish" aria-label="发文交接" title="发文交接"><span data-icon="upload"></span><span class="nav-text">发文交接</span></button>
      <button data-page="hosts" aria-label="执行主机" title="执行主机"><span data-icon="monitor"></span><span class="nav-text">执行主机</span></button>
      <button data-page="diagrams" aria-label="流程与架构" title="流程与架构"><span data-icon="diagram"></span><span class="nav-text">流程与架构</span></button>
    </nav>
    <div class="sidebar-note"><span class="note-caption">当前计划</span><strong>003 · 界面预览</strong><p>先完成单机 MVP<br>再加入局域网分工</p></div>
    <footer><span class="connection-dot"></span>本地工作空间<span>v0.1</span></footer>
  </aside>
  <main id="main-content" tabindex="-1">
    <header class="topbar"><div class="breadcrumb"><span>工作空间</span><span data-icon="chevron"></span><span id="page-label">任务总表</span></div><div class="top-right"><span class="local-badge"><span class="connection-dot"></span>仅本机</span><span class="avatar" aria-hidden="true">演</span><span>演示运营</span></div></header>
    <div class="demo-banner"><span class="demo-tag">演示模式</span><p>虚构数据，操作仅改变模拟状态。</p><button id="reset" class="text-button"><span data-icon="reset"></span>重置演示</button></div>
    <section class="page-heading"><div><h1 id="page-title">任务总表</h1><p id="page-subtitle">查看每日任务、处理阻塞并跟踪交接进度。</p></div><div class="heading-controls"><label for="scenario">演示场景</label><select id="scenario" name="scenario"></select><button class="primary" id="import-demo"><span data-icon="plus"></span>模拟导入任务</button></div></section>
    <section id="page-content"></section>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </main>
  <div id="drawer-backdrop" hidden></div><aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1" hidden></aside>
  <script type="module" src="/app.js"></script>
</body></html>
